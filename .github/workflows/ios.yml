# Builds an UNSIGNED Marquee.ipa for AltStore / SideStore (they re-sign it with your Apple ID).
# Run it from the Actions tab (Run workflow); the IPA is the "Marquee-ipa" artifact.
name: ios
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web assets
        env:
          TRAKT_ID: ${{ secrets.TRAKT_ID }}
        run: |
          mkdir -p ios/Web
          cp index.html player.html app.js protocol.js sync.js playback.js look.js trakt.js diag.js icon.svg icon-512.png manifest.webmanifest sw.js ios/Web/
          node -e 'console.log("export default " + JSON.stringify({ id: process.env.TRAKT_ID || "" }) + ";")' > ios/Web/trakt-config.js
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build unsigned
        run: |
          cd ios
          xcodebuild -project Marquee.xcodeproj -scheme Marquee -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the IPA
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Marquee.app Payload/
          zip -qr Marquee.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-ipa
          path: ios/Marquee.ipa
      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in {1..30}; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" ios/Marquee.ipa --clobber
              echo "Uploaded Marquee.ipa to release ${{ github.ref_name }}"
              exit 0
            fi
            echo "Waiting for release ${{ github.ref_name }}..."
            sleep 10
          done
          gh release create "${{ github.ref_name }}" ios/Marquee.ipa --title "Marquee ${{ github.ref_name }}" || gh release upload "${{ github.ref_name }}" ios/Marquee.ipa --clobber
