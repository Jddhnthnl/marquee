# Builds an UNSIGNED Marquee.ipa for AltStore / SideStore (they re-sign it with your Apple ID).
# Run it from the Actions tab (Run workflow); the IPA is the "Marquee-ipa" artifact.
name: ios
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build unsigned
        run: |
          cd ios
          xcodebuild -project Marquee.xcodeproj -scheme Marquee -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the IPA
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Marquee.app Payload/
          zip -qr Marquee.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-ipa
          path: ios/Marquee.ipa
