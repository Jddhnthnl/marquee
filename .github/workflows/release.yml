# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to build and publish a release.
# The app's updater reads latest.json from the newest release. A tag with a dash (v0.7.1-beta.1) is a prerelease,
# which only the Beta channel sees: every release also refreshes latest-beta.json on the fixed "beta" release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    concurrency: release # one tag at a time, so two runs can't race on latest-beta.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch mpv
        shell: bash
        run: bash src-tauri/fetch-mpv.sh
      - name: Write the Trakt config (repo secrets, never committed)
        shell: bash
        env:
          TRAKT_ID: ${{ secrets.TRAKT_ID }}
          TRAKT_SECRET: ${{ secrets.TRAKT_SECRET }}
        run: |
          test -n "$TRAKT_ID" && test -n "$TRAKT_SECRET" || { echo "TRAKT_ID / TRAKT_SECRET repo secrets are missing"; exit 1; }
          node -e 'console.log("export default " + JSON.stringify({ id: process.env.TRAKT_ID, secret: process.env.TRAKT_SECRET }) + ";")' > trakt-config.js
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: Marquee ${{ github.ref_name }}
          releaseBody: Download the -setup.exe below. Windows may warn "Windows protected your PC" — click More info → Run anyway.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish to the Beta channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -O latest-beta.json
          gh release view beta >/dev/null 2>&1 || gh release create beta --prerelease --title 'Beta channel' --notes 'Update manifest for the Beta channel. Not an installer.'
          gh release download beta -p latest-beta.json -O old-beta.json 2>/dev/null || echo '{"version":"0.0.0"}' > old-beta.json
          # an older tag (rebuilt or pushed late) must never move Beta users backwards
          if node .github/newer.mjs latest-beta.json old-beta.json; then gh release upload beta latest-beta.json --clobber
          else echo "Beta already offers a newer version; left as is."; fi
